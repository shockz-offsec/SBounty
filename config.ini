#################################################################
#                     Sbounty config file                       #
#################################################################
# Engines to run (true/false). A missing tool is skipped with a notice
# (graceful degradation), never fatal. Engines run in parallel by default
# (use -p for sequential), each rate-limited.

dast=true        # nuclei -dast: BROAD core. XSS/SQLi/SSTI/LFI/open-redirect/SSRF/CRLF/cmdi in
                 # query/path/headers/cookie (GET), with AUTOMATIC out-of-band (interactsh) -> it
                 # already covers the "blind" cases (e.g. blind SSRF) with zero setup.
                 # If nuclei is absent, a lightweight native LFI/SSTI/open-redirect check fills in.

xss_deep=true    # dalfox: XSS depth (reflected/DOM, context-aware). Precision nuclei's templates do
                 # not reach. STORED XSS is a separate engine (stored_xss). Blind XSS: blind_xss_url.

sqli_deep=true   # sqlmap: SQLi depth + exploitation. GET params + POST forms (tests the <form>s on the
                 # already-crawled dynamic pages: login auth-bypass, register, search). Tuned BEU.

stored_xss=true  # STORED XSS: plants a unique canary in params + forms, re-fetches and looks for the
                 # RAW (unescaped) breakout -> persistence = executable. NOTE: it SUBMITS data (writes).

secrets=true     # Sensitive data exposure: high-confidence secrets (AWS/Google/GitHub/GitLab/Slack/
                 # Stripe/SendGrid keys, private keys) in JS/JSON/map files. Read-only.

cors=true        # improved CORS: arbitrary origin, null origin, suffix bypass, credentials reflection.

# Parameter mining: arjun discovers hidden params the crawl did not reveal (feeds every engine).
param_mining=true

# WAF/CDN detection at the start of each host (red warning + best-effort origin discovery behind it).
waf_check=true

# OPTIONAL blind-XSS callback for dalfox only: your own XSS Hunter / collaborator URL that dalfox
# pings with blind payloads. NOT needed for anything else -- nuclei -dast already does its OWN
# out-of-band automatically (blind SSRF, etc.). Leave empty to skip.
blind_xss_url=""
#---#
